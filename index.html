<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SEO: api/share.ts reemplaza estas etiquetas (title, description, og:*, twitter:*) en los enlaces /h/:id. -->
    <title>Huecazo · Reporta huecos en las pistas de todo el Perú</title>
    <meta name="description" content="Mapa ciudadano de huecos en las pistas de todo el Perú. Toma una foto, marca la ubicación y repórtalo en 30 segundos, sin registrarte." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Huecazo" />
    <meta name="apple-mobile-web-app-title" content="Huecazo" />
    <link rel="canonical" href="https://huecazo.com/" />

    <!-- Vista previa al compartir (WhatsApp, Facebook, X, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Huecazo" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:url" content="https://huecazo.com/" />
    <meta property="og:title" content="Huecazo · Reporta huecos en las pistas de todo el Perú" />
    <meta property="og:description" content="¿Viste un hueco en la pista? Repórtalo en 30 segundos con una foto y tu ubicación, sin registrarte." />
    <meta property="og:image" content="https://huecazo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Huecazo: reporta los huecos de tu ciudad en 30 segundos, con foto y ubicación." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Huecazo · Reporta huecos en las pistas de todo el Perú" />
    <meta name="twitter:description" content="¿Viste un hueco en la pista? Repórtalo en 30 segundos con una foto y tu ubicación, sin registrarte." />
    <meta name="twitter:image" content="https://huecazo.com/og-image.png" />

    <!-- Datos estructurados para Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://huecazo.com/#website",
            "url": "https://huecazo.com/",
            "name": "Huecazo",
            "inLanguage": "es-PE",
            "description": "Mapa ciudadano de huecos en las pistas del Perú."
          },
          {
            "@type": "WebApplication",
            "@id": "https://huecazo.com/#app",
            "name": "Huecazo",
            "url": "https://huecazo.com/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Android, iOS, Web",
            "inLanguage": "es-PE",
            "isAccessibleForFree": true,
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PEN" },
            "areaServed": { "@type": "Country", "name": "Perú" },
            "description": "Reporta los huecos de las pistas de tu ciudad en 30 segundos, con foto y ubicación, sin registrarte.",
            "image": "https://huecazo.com/og-image.png"
          }
        ]
      }
    </script>

    <meta name="theme-color" content="#FFF8F0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Contenido para buscadores y navegadores sin JavaScript -->
    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #2f2b3a">
        <h1>Huecazo: reporta los huecos de las pistas de tu ciudad</h1>
        <p>
          Huecazo es un mapa ciudadano para reportar huecos en las pistas. Toma una foto, marca la ubicación en el mapa y
          envía tu reporte en 30 segundos, sin registrarte, en todo el Perú.
        </p>
        <p><a href="/acerca">¿Qué es Huecazo y cómo funciona?</a></p>
        <p>Para usar el mapa y reportar, activa JavaScript en tu navegador.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
